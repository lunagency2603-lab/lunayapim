<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img"
     aria-label="Hizmet tanıtım animasyonu" style="width:100%;height:auto;display:block">
  <style>
    .z{fill:#14110f} .k{fill:#efe7dd} .r{fill:#e8452c} .g{fill:#8a8079}
    .cz{stroke:#2a2724;stroke-width:1;fill:none}
    .yz{font-family:'Manrope',system-ui,sans-serif;font-size:15px}
    .bs{font-family:'Bricolage Grotesque','Manrope',sans-serif;font-weight:800;font-size:26px}
    .et{font-family:'Space Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.1em}
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; }
    }
  </style>
  <rect class="z" width="640" height="300"/>
  <rect class="cz" x="12" y="12" width="616" height="276" rx="6"/>
  <text x="70" y="66" class="bs k">Kameranın giremediği yer</text><line x1="70" y1="84" x2="130" y2="84" stroke="#e8452c" stroke-width="3"/><path d="M70 230 C 180 230, 200 90, 320 120 S 480 210, 570 130" fill="none" stroke="#e8452c" stroke-width="2" stroke-linecap="round" stroke-dasharray="700" stroke-dashoffset="700"><animate attributeName="stroke-dashoffset" values="700;700;0;0;700" keyTimes="0;0.062;0.237;0.9;1" dur="8s" repeatCount="indefinite"/></path><circle r="5" class="r" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.06;0.12;0.88;1" dur="8s" repeatCount="indefinite"/><animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.06;0.8;1" calcMode="linear" path="M70 230 C 180 230, 200 90, 320 120 S 480 210, 570 130"/></circle><rect x="500" y="100" width="96" height="74" fill="none" stroke="#2a2724" stroke-width="1.5" opacity="0" transform-origin="500 174"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.650;0.725;0.9;1" dur="8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="scale" values="1 0;1 0;1 1;1 1;1 1" keyTimes="0;0.650;0.725;0.9;1" dur="8s" repeatCount="indefinite"/></rect><text x="70" y="272" class="et g" opacity="0">Kalkış<animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.075;0.138;0.86;0.94;1" dur="8s" repeatCount="indefinite"/></text><text x="275" y="272" class="et g" opacity="0">Tek planda geçiş<animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.275;0.338;0.86;0.94;1" dur="8s" repeatCount="indefinite"/></text><text x="251" y="272" class="et g" opacity=".35">→</text><text x="445" y="272" class="et g" opacity="0">İç mekân<animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.475;0.538;0.86;0.94;1" dur="8s" repeatCount="indefinite"/></text><text x="421" y="272" class="et g" opacity=".35">→</text>
</svg>