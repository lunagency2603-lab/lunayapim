name: TrendSaphiens günlük yayın

# Bilgisayardan bağımsız çalışır: GitHub'ın sunucusunda, Mac kapalı olsa da.
# 05:30 UTC = 08:30 TR (gündem + trend + konu)  ·  13:00 UTC = 16:00 TR (TCMB 15:30 sonrası)
# 3 saatte bir (xx:15 UTC): çok aranan konulara yeni sayfa (konu.py)
# main'e her push: yalnız sayfaları yeniden basar ve yayınlar (veri toplamaz, yazar çağırmaz)
on:
  schedule:
    - cron: "30 5 * * *"
    - cron: "0 13 * * *"
    - cron: "15 */3 * * *"
  push:
    branches: [main]
    paths-ignore:
      - ".otomasyon/veri/**"
  workflow_dispatch:
    inputs:
      kip:
        description: "Hangi tur çalışsın"
        required: false
        default: "otomatik"
        type: choice
        options: [otomatik, sabah, aksam, konu, yalniz-yayin]
      hizmet_bildir:
        description: "Luna Yapım hizmet sayfalarının TAMAMINI arama motorlarına bildir"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: trendsaphiens-gunluk
  cancel-in-progress: false

jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Istanbul
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LUNA_X_ANAHTAR: ${{ secrets.LUNA_X_ANAHTAR }}
      LUNA_X_GIZLI: ${{ secrets.LUNA_X_GIZLI }}
      LUNA_X_JETON: ${{ secrets.LUNA_X_JETON }}
      LUNA_X_JETON_GIZLI: ${{ secrets.LUNA_X_JETON_GIZLI }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Görsel küçültme aracı
        run: pip install --quiet pillow || echo "pillow kurulamadı — görseller küçültülmeden kaydedilir"

      - name: Anahtar sağlığı
        run: |
          # Anahtarın KENDİSİ yazılmaz; yalnız var/yok bilgisi. Koşu özetinde görünür.
          {
            echo "### Anahtar sağlığı"
            if [ -n "$ANTHROPIC_API_KEY" ]; then
              echo "- ANTHROPIC_API_KEY: **var** — TrendSaphiens özgün yazı üretebilir"
            else
              echo "- ANTHROPIC_API_KEY: **YOK** — TrendSaphiens haber yayınlamayacak (derleme biçimi kaldırıldı)"
            fi
            if [ -n "$LUNA_X_ANAHTAR" ]; then echo "- X paylaşımı: var"; else echo "- X paylaşımı: yok (isteğe bağlı)"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -n "$ANTHROPIC_API_KEY" ] && echo "ANTHROPIC_API_KEY: var" || echo "ANTHROPIC_API_KEY: YOK"

      - name: Yolları kur
        run: |
          mkdir -p "$HOME/Documents/GitHub"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/Documents/GitHub/lunayapim"
          ln -sfn "$GITHUB_WORKSPACE/.otomasyon" "$HOME/Documents/luna-pusula"
          echo "PUSULA=$GITHUB_WORKSPACE/.otomasyon" >> $GITHUB_ENV

      - name: Veri topla ve yayınla
        working-directory: .otomasyon
        run: |
          KIP="${{ github.event.inputs.kip }}"
          OLAY="${{ github.event_name }}"
          PLAN="${{ github.event.schedule }}"
          [ -z "$KIP" ] && KIP=otomatik
          if [ "$KIP" = "otomatik" ]; then
            if [ "$OLAY" = "push" ]; then KIP=yalniz-yayin
            elif [ "$PLAN" = "15 */3 * * *" ]; then KIP=konu
            elif [ "$PLAN" = "0 13 * * *" ]; then KIP=aksam
            elif [ "$PLAN" = "30 5 * * *" ]; then KIP=sabah
            elif [ "$(date +%H)" -lt 12 ]; then KIP=sabah; else KIP=aksam; fi
          fi
          echo "### Tur: $KIP ($OLAY)" >> "$GITHUB_STEP_SUMMARY"
          echo "Tur: $KIP · $(date '+%d.%m.%Y %H:%M') TR"
          case "$KIP" in
            sabah)        python3 -m pusula.cli gundem-gunluk
                          python3 -m pusula.cli konu --paylas ;;
            aksam)        python3 -m pusula.cli konu --topla --paylas ;;
            konu)         python3 -m pusula.cli konu --topla --paylas ;;
            yalniz-yayin) python3 -m pusula.cli trend ;;
          esac

      - name: Yazar defteri
        if: always()
        working-directory: .otomasyon
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          try:
              d = json.load(open("veri/yazar-kayit.json", encoding="utf-8"))
          except Exception as e:
              print("yazar defteri yok:", e); raise SystemExit
          print("### Yazar defteri (son 15)")
          print("| zaman | olay | tür | başlık | ayrıntı |"); print("|---|---|---|---|---|")
          for o in d[-15:]:
              ayr = o.get("ayrinti") or (("%s kelime" % o["kelime"]) if o.get("kelime") else "") or json.dumps(o.get("anahtar", ""), ensure_ascii=False)
              print("| %s | %s | %s | %s | %s |" % (o.get("zaman",""), o.get("olay",""), o.get("tur",""), (o.get("baslik") or "")[:50].replace("|","/"), str(ayr)[:120].replace("|","/")))
          PY

      - name: Üretim sonrası işlem
        working-directory: .otomasyon
        run: python3 site-uretici/sonislem.py "$GITHUB_WORKSPACE"

      - name: Görseli olmayan yazılara kapak bul
        working-directory: .otomasyon
        run: |
          python3 -m pusula.gorsel_tamamla || true
          # yeni kapak bulunduysa sayfalar o görselle yeniden bassın
          python3 -m pusula.cli trend || true
          python3 site-uretici/sonislem.py "$GITHUB_WORKSPACE" || true

      - name: Araç sayfalarını ve günün bültenini bas
        working-directory: .otomasyon
        run: |
          python3 -m pusula.arac || true
          python3 -m pusula.bulten_sayfa || true
          python3 -m pusula.kurumsal || true
          # 22.09.2026 — bu üç modül SON sonislem'den sonra sayfa basıyordu; yani
          # bastıkları sayfalara varlık şeması, ilk görsel önceliği ve site
          # haritası temizliği uygulanmıyordu. Canlıda /404 site haritasına
          # girmişti (noindex bir adres haritada durunca Search Console hata verir).
          python3 site-uretici/sonislem.py "$GITHUB_WORKSPACE" || true

      - name: Canlı künye ve site asistanı tazele
        working-directory: .otomasyon
        run: |
          python3 -m pusula.asistan
          python3 -m pusula.motor

      - name: SEO kapısı
        working-directory: .otomasyon
        run: |
          RAPOR=$(python3 -m seo.denetci | head -1)
          echo "$RAPOR"
          echo "### SEO kapısı" >> $GITHUB_STEP_SUMMARY
          echo "\`$RAPOR\`" >> $GITHUB_STEP_SUMMARY
          case "$RAPOR" in
            *"HATA: 0"*) echo "Kapı açık — yayına gidiyor." ;;
            *) echo "::error::SEO kapısı kapalı, yayın yapılmadı — $RAPOR"
               python3 -m seo.denetci | head -40 >> $GITHUB_STEP_SUMMARY
               exit 1 ;;
          esac

      - name: Yayınla (commit + push)
        run: |
          git config user.name "Luna Otomasyon"
          git config user.email "lunagency2603@gmail.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Değişiklik yok — push atlanıyor."
            echo "Değişiklik yok." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          git add -A
          git commit -q -m "TrendSaphiens günlük yayın $(date '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
          echo "Yayınlandı: $(git log -1 --format='%h %s')" >> $GITHUB_STEP_SUMMARY

      - name: Luna Yapım sayfalarını arama motorlarına bildir
        if: always()
        working-directory: .otomasyon
        run: |
          # 22.09.2026: IndexNow yalnız trend.py'den çağrılıyordu; Luna Yapım'ın
          # hizmet sayfaları (baskı/hediye kolu dahil) hiç bildirilmiyordu.
          if [ "${{ github.event.inputs.hizmet_bildir }}" = "true" ]; then
            python3 -m pusula.bildirim --hepsi | tee /tmp/bildirim.txt
          else
            python3 -m pusula.bildirim | tee /tmp/bildirim.txt
          fi
          { echo "### Hizmet sayfası bildirimi"; echo '```'; cat /tmp/bildirim.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Cloudflare yayınını tetikle
        if: success()
        env:
          CF_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          # Cloudflare Pages'in GitHub bağlantısı koparsa yayın durmasın diye
          # dağıtımı buradan tetikliyoruz. Gizli tanımlı değilse adım sessizce geçer.
          if [ -z "$CF_HOOK" ]; then
            echo "CF_DEPLOY_HOOK tanımlı değil — dağıtım tetiklenmedi." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          kod=$(curl -sS -o /tmp/cf.json -w "%{http_code}" -X POST "$CF_HOOK" || echo 000)
          echo "### Cloudflare dağıtımı" >> "$GITHUB_STEP_SUMMARY"
          echo "Tetikleyici yanıtı: HTTP $kod" >> "$GITHUB_STEP_SUMMARY"
          if [ "$kod" != "200" ]; then
            echo "::warning::Cloudflare dağıtımı tetiklenemedi (HTTP $kod)"
          fi

      - name: Canlı kontrol
        if: always()
        working-directory: .otomasyon
        run: |
          sleep 90
          python3 -m pusula.gunluk_kontrol || true
          echo "### Canlı kontrol" >> $GITHUB_STEP_SUMMARY
          python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, os
          try:
              d = json.load(open("veri/gunluk-kontrol.json", encoding="utf-8"))
              son = d[-1] if isinstance(d, list) else d
              print("```"); print(json.dumps(son, ensure_ascii=False, indent=1)[:1500]); print("```")
          except Exception as e:
              print("kontrol dosyası okunamadı:", e)
          PY
